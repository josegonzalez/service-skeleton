---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      gin:
        patterns:
          - "github.com/gin-gonic/*"
          - "github.com/gin-contrib/*"
  - package-ecosystem: "gomod"
    directory: "/examples/hello-world"
    schedule:
      interval: "daily"
    groups:
      gin:
        patterns:
          - "github.com/gin-gonic/*"
          - "github.com/gin-contrib/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
